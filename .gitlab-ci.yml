stages:
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"

unit_and_feature_tests:
  stage: test
  image: php:8.2-cli-alpine
  before_script:
    - apk add --no-cache nodejs npm libzip-dev icu-dev libpng-dev libjpeg-turbo-dev freetype-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install pdo pdo_sqlite zip intl gd bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cp .env.example .env
    - composer install --no-progress --prefer-dist
    - php artisan key:generate
    - npm ci
    - npm run build
  script:
    - php artisan test --parallel

docker_build:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  only:
    - main
  script:
    - docker build -t devops-work-tracker:latest .
